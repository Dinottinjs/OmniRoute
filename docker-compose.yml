version: '3.8'

services:
  omnioroute:
    build: .
    image: omnioroute-app
    container_name: omnioroute_cli
    # Wichtig: 'network_mode: host' und 'privileged: true' sind nötig, 
    # damit der Container (unter Linux) Zugriff auf die physischen WLAN-Schnittstellen hat.
    # Beachte: Unter Windows/Mac (Docker Desktop) ist der Zugriff auf die WLAN-Hardware des Hosts
    # aus der VM heraus stark eingeschränkt. Das Scannen von WLANs funktioniert am besten nativ (via start.bat).
    network_mode: "host"
    privileged: true
    volumes:
      - .:/app
    # Standard-Kommando überschreiben (optional, z.B. scan)
    command: ["scan"]
